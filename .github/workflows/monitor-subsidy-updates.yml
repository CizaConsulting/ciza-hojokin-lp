name: Monitor official subsidy updates

# Scheduled execution is handled by the ChatGPT task. Keep this workflow for manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subsidy-blog-automation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-package-lock --no-audit --no-fund

      - name: Check official sources and create at most one draft
        run: npm run blog:monitor
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NOTION_ARTICLE_DRAFT_DATA_SOURCE_ID: ${{ secrets.NOTION_ARTICLE_DRAFT_DATA_SOURCE_ID }}
          NOTION_TARGET_SITE: 補助金
          NOTION_REVIEW_STATUS: 要レビュー

      - name: Ignore timestamp-only state changes
        shell: bash
        run: |
          if git diff --quiet -- data/subsidy-source-state.json; then
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const current = JSON.parse(fs.readFileSync('data/subsidy-source-state.json', 'utf8'));
          const previous = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:data/subsidy-source-state.json'], { encoding: 'utf8' }));
          const normalize = (value) => {
            const copy = JSON.parse(JSON.stringify(value));
            delete copy.updatedAt;
            for (const source of Object.values(copy.sources || {})) delete source.checkedAt;
            return copy;
          };
          if (JSON.stringify(normalize(current)) === JSON.stringify(normalize(previous))) {
            cp.execFileSync('git', ['checkout', '--', 'data/subsidy-source-state.json']);
          }
          NODE

      - name: Save source snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/subsidy-source-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subsidy-source-state.json
          git commit -m "補助金公式情報の監視状態を更新"
          git push origin HEAD:main
