name: Generate subsidy practical article draft

on:
  schedule:
    # Wednesday 10:00 JST (01:00 UTC)
    - cron: '0 1 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subsidy-blog-automation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate one subsidy practical article in Notion
        run: npm run blog:generate-practical
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          NOTION_MEETING_LOG_DATA_SOURCE_ID: ${{ secrets.NOTION_MEETING_LOG_DATA_SOURCE_ID }}
          NOTION_JUDGMENT_LIBRARY_DATA_SOURCE_ID: ${{ secrets.NOTION_JUDGMENT_LIBRARY_DATA_SOURCE_ID }}
          NOTION_ARTICLE_DRAFT_DATA_SOURCE_ID: ${{ secrets.NOTION_ARTICLE_DRAFT_DATA_SOURCE_ID }}
          NOTION_TARGET_SITE: 補助金
          NOTION_SUBSIDY_TAG: 補助金
          NOTION_REVIEW_STATUS: 要レビュー
